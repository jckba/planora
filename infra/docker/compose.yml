services:
  postgresql:
    image: postgres:17
    container_name: planora-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - planora-postgresql-data:/var/lib/postgresql/data
    networks:
      - planora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  #add depends on the condition: service_healthy

volumes:
  planora-postgresql-data:

networks:
  planora-network:
    driver: bridge




