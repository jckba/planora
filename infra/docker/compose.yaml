services:
  postgresql:
    image: postgres:17
    container_name: planora-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - planora-postgresql-data:/var/lib/postgresql/data
    networks:
      - planora-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PLANORA_JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt_private
      PLANORA_JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      PLANORA_FRONTEND_ORIGIN: ${PLANORA_FRONTEND_ORIGIN:?PLANORA_FRONTEND_ORIGIN is required}

    secrets:
      - jwt_private
      - jwt_public

    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - planora-network

volumes:
  planora-postgresql-data:

networks:
  planora-network:
    driver: bridge

secrets:
  jwt_private:
    file: ./secrets/jwt-private.pem

  jwt_public:
    file: ./secrets/jwt-public.pem





