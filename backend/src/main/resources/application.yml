spring:
  application:
    name: planora-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:planora}
    username: ${POSTGRES_USER:planora}
    password: ${POSTGRES_PASSWORD:planora}

  flyway:
    enabled: true
    schemas:
      - planora
    default-schema: planora

  jooq:
    sql-dialect: POSTGRES

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope:
              - openid
              - profile
              - email

  mail:
    host: ${PLANORA_SMTP_HOST:smtp.gmail.com}
    port: ${PLANORA_SMTP_PORT:587}
    username: ${PLANORA_SMTP_USERNAME:username}
    password: ${PLANORA_SMTP_PASSWORD:password}
    properties:
      mail:
        debug: true
        smtp:
          auth: false
          starttls:
            enable: false
            required: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

planora:
  security:
    jwt:
      issuer: ${PLANORA_JWT_ISSUER:http://localhost:8080}
      access-token-ttl: ${PLANORA_JWT_ACCESS_TOKEN_TTL:PT30M}
      onboarding-token-ttl: ${PLANORA_JWT_ONBOARDING_TOKEN_TTL:PT10M}
      private-key-location: ${PLANORA_JWT_PRIVATE_KEY_LOCATION:file:../infra/docker/secrets/jwt-private.pem}
      public-key-location: ${PLANORA_JWT_PUBLIC_KEY_LOCATION:file:../infra/docker/secrets/jwt-public.pem}

    google:
      frontend-origin: ${PLANORA_FRONTEND_ORIGIN:http://localhost:4200}

    email-verification:
      hmac-key: ${PLANORA_EMAIL_VERIFICATION_HMAC_KEY:clave-hmac-key}
      code-validity: PT15M
      max-attempts: 3
      resend-delay: PT1M

  mail:
    from: ${PLANORA_MAIL_FROM:mail-from}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: false
        http-only: true
        same-site: lax
#debug: true
