spring:
  application:
    name: planora-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    schemas:
      - planora
    default-schema: planora

  jooq:
    sql-dialect: POSTGRES

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

planora:
  security:
    jwt:
      issuer: ${PLANORA_JWT_ISSUER:http://localhost:8080}
      access-token-ttl: ${PLANORA_JWT_ACCESS_TOKEN_TTL:PT15M}
      private-key-location: ${PLANORA_JWT_PRIVATE_KEY_LOCATION:file:../infra/docker/secrets/jwt-private.pem}
      public-key-location: ${PLANORA_JWT_PUBLIC_KEY_LOCATION:file:../infra/docker/secrets/jwt-public.pem}

    google:
      frontend-origin: ${PLANORA_FRONTEND_ORIGIN:http://localhost:4200}

    email-verification:
      hmac-key: ${PLANORA_EMAIL_VERIFICATION_HMAC_KEY}
      code-validity: PT15M
      max-attempts: 3
      resend-delay: PT1M

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: lax
#debug: true
